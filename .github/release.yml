# Groups the automatically generated release notes used by draft-release.yml and
# release.yml. Pull requests are sorted into the first category whose labels they match;
# the final wildcard catches anything unlabelled, so this works even without label
# discipline.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Testing and CI
      labels: [testing, ci]
    - title: Documentation
      labels: [documentation, docs]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
