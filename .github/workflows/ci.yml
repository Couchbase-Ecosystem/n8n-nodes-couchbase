name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is package.json#engines.node; upper bound is what n8n ships today.
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      # Runs against dist/, so it has to come after the build.
      - name: Package contract tests
        run: pnpm test:package

      # The stricter rule set `prepublishOnly` enforces at release time. Running it
      # here means a release cannot fail on a lint rule that CI never checked.
      - name: Prepublish lint
        run: pnpm lint -c .eslintrc.prepublish.js nodes credentials package.json
