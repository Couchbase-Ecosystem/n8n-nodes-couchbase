name: E2E

# Installs the package into a real n8n instance as a community node and runs
# workflows against a real Couchbase cluster.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly, to catch breakage from new n8n releases rather than our own changes.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      n8n_image_tag:
        description: 'n8n image tag to test against'
        required: false
        default: 'latest'
      couchbase_image_tag:
        description: 'Couchbase Server image tag to test against'
        required: false
        default: 'enterprise-7.6.3'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Install into n8n & run workflows (${{ matrix.arch.name }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: amd64, runner: ubuntu-latest }
          # n8n's Docker image is widely run on arm64 (Apple Silicon, Graviton, Pi),
          # and the Couchbase SDK ships per-architecture prebuilt bindings, so the
          # install path genuinely differs. Free on public repos.
          - { name: arm64, runner: ubuntu-24.04-arm }

    env:
      N8N_IMAGE_TAG: ${{ inputs.n8n_image_tag || 'latest' }}
      COUCHBASE_IMAGE_TAG: ${{ inputs.couchbase_image_tag || 'enterprise-7.6.3' }}
      # Leave the stack up so the failure step can collect logs; torn down below.
      E2E_KEEP: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E
        run: ./test/e2e/run.sh

      - name: Collect service logs
        if: failure()
        run: |
          docker compose -f test/e2e/docker-compose.yml ps || true
          for svc in n8n couchbase verdaccio; do
            echo "::group::$svc logs"
            docker compose -f test/e2e/docker-compose.yml logs --tail=300 "$svc" || true
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: docker compose -f test/e2e/docker-compose.yml down -v --remove-orphans || true
