name: Label pull requests

# Applies the release-note labels documented in AGENTS.md so the notes generated by
# draft-release.yml stay grouped even when a PR is opened without them. An unlabelled PR
# falls through to "Other changes" in .github/release.yml, which is what this prevents.
#
# Labels are only ever added, never removed. A maintainer correcting a label on the PR
# keeps that correction, and this workflow will not put the old one back on the next
# push. Everything here is deliberately conservative: it labels what the diff and the
# title actually prove, and stays quiet otherwise rather than guessing.
#
# pull_request_target rather than pull_request, because the token handed to a forked
# `pull_request` run is read-only and could not label anything — which is exactly the
# case (an outside contribution) most likely to arrive unlabelled. Nothing from the head
# branch is checked out or executed here, and contributor-controlled text (the title and
# body) reaches the script only through `env`, never through `${{ }}` interpolation.

on:
  pull_request_target:
    # `edited` covers a title being fixed up after the PR was opened.
    types: [opened, reopened, synchronize, edited, ready_for_review]

concurrency:
  group: label-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Creating repository labels is governed by `issues`; applying them to a PR by
  # `pull-requests`.
  issues: write
  pull-requests: write

jobs:
  label:
    name: Apply release-note labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Applying a label that does not exist in the repository fails, and the label set
      # here is the one AGENTS.md and .github/release.yml both assume. Creating the
      # missing ones keeps the three in step; existing labels are left alone so
      # hand-picked colours and descriptions survive.
      - name: Create any missing labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          existing="$(gh label list --limit 200 --json name --jq '.[].name')"

          while IFS='|' read -r name colour description; do
            if ! grep -qxF "$name" <<<"$existing"; then
              echo "Creating missing label: $name"
              gh label create "$name" --color "$colour" --description "$description"
            fi
          done <<'LABELS'
          breaking-change|b60205|User-visible behaviour or supported n8n versions actually change
          enhancement|a2eeef|New functionality
          bug|d73a4a|Fixes
          testing|bfd4f2|Test suite changes
          ci|c5def5|Workflows and release automation
          documentation|0075ca|Documentation only
          dependencies|0366d6|Dependency updates
          skip-changelog|ededed|Version bumps and chores kept out of the release notes
          LABELS

      # Path rules live in .github/labeler.yml. Under pull_request_target the action
      # reads that config from the base branch, not from the PR.
      - name: Label by changed paths
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
          # Without this the `.github/**` rules match nothing.
          dot: true

      - name: Label by title and package.json contents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          labels=()
          reasons=()
          add() {
            local label=$1 reason=$2
            for seen in ${labels[@]+"${labels[@]}"}; do
              [[ "$seen" == "$label" ]] && return 0
            done
            labels+=("$label")
            reasons+=("$label — $reason")
            echo "+ $label ($reason)"
          }

          # --- Conventional-commit prefix ---------------------------------------
          # Only fires when the title actually carries a recognised prefix. Titles
          # written in prose ("Add Automated Testing") contribute nothing here and fall
          # back to the path rules, so this can under-label but never invent a category.
          if [[ "$PR_TITLE" =~ ^([a-zA-Z]+)(\(([^\)]*)\))?(!)?:[[:space:]] ]]; then
            type="$(tr '[:upper:]' '[:lower:]' <<<"${BASH_REMATCH[1]}")"
            scope="$(tr '[:upper:]' '[:lower:]' <<<"${BASH_REMATCH[3]}")"
            breaking="${BASH_REMATCH[4]}"

            # chore(deps), build(deps), fix(deps-dev), … — the renovate/dependabot shape.
            # A deps scope settles the category on its own, and the type in front of it
            # is noise: `fix(deps)` is a dependency bump, not a bug fix, and the
            # categories in .github/release.yml are first-match, so letting `bug` or
            # `ci` through as well would file it under the wrong heading.
            case "$scope" in
              *deps*)
                add dependencies "\`($scope)\` scope"
                type=''
                ;;
            esac

            case "$type" in
              feat) add enhancement "\`feat:\` title" ;;
              fix) add bug "\`fix:\` title" ;;
              docs) add documentation "\`docs:\` title" ;;
              test) add testing "\`test:\` title" ;;
              # `build:` is the build system and its tooling, which is what `ci` covers
              # for release-note purposes.
              ci | build) add ci "\`$type:\` title" ;;
              deps) add dependencies "\`deps:\` title" ;;
              # perf/refactor/style/chore have no release-note category of their own —
              # left for the path rules or a maintainer.
            esac

            # AGENTS.md is explicit that breaking-change is a judgement about user-facing
            # compatibility, so only the author's own declaration counts — never
            # something inferred from the diff.
            if [[ -n "$breaking" ]]; then
              add breaking-change "\`!\` marker in the title"
            fi
          fi

          if grep -qE '^BREAKING[ -]CHANGE:' <<<"${PR_BODY:-}"; then
            add breaking-change "\`BREAKING CHANGE:\` footer"
          fi

          # --- package.json -----------------------------------------------------
          # The path alone is ambiguous: dependency work and release version bumps both
          # touch this one file. Compare the base and head copies and label on which
          # fields actually moved.
          changed_files="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"

          if grep -qxF 'package.json' <<<"$changed_files"; then
            fetch() {
              gh api -H 'Accept: application/vnd.github.raw' \
                "repos/$GH_REPO/contents/package.json?ref=$1"
            }
            fetch "$BASE_SHA" >/tmp/pkg-base.json || echo '{}' >/tmp/pkg-base.json
            fetch "$HEAD_SHA" >/tmp/pkg-head.json || echo '{}' >/tmp/pkg-head.json

            # Never fail the check over a labelling heuristic — a malformed package.json
            # is CI's problem to report, not this workflow's.
            verdict="$(node -e '
              const fs = require("fs");
              const base = JSON.parse(fs.readFileSync("/tmp/pkg-base.json", "utf8"));
              const head = JSON.parse(fs.readFileSync("/tmp/pkg-head.json", "utf8"));
              const differs = (key) =>
                JSON.stringify(base[key]) !== JSON.stringify(head[key]);

              // `engines` is deliberately not in this list. Moving the supported Node or
              // pnpm floor is a support-policy decision that may well deserve
              // breaking-change, so it is left for a maintainer rather than quietly
              // filed under Dependencies.
              const depFields = [
                "dependencies",
                "devDependencies",
                "peerDependencies",
                "optionalDependencies",
                "overrides",
                "resolutions",
                "pnpm",
                "packageManager",
              ];

              const out = [];
              if (depFields.some(differs)) out.push("dependencies");

              const touched = [
                ...new Set([...Object.keys(base), ...Object.keys(head)]),
              ].filter(differs);
              if (touched.length === 1 && touched[0] === "version") {
                out.push("version-only");
              }

              console.log(out.join(" "));
            ' || echo '')"

            case " $verdict " in
              *" dependencies "*) add dependencies "dependency fields in \`package.json\` changed" ;;
            esac

            # A release version bump and nothing else — PR #27 is the shape. If the PR
            # carries any other file the bump is incidental to a real change, and the
            # PR belongs in the notes.
            if [[ " $verdict " == *" version-only "* && "$(wc -l <<<"$changed_files")" -eq 1 ]]; then
              add skip-changelog "\`package.json\` version bump and nothing else"
            fi
          fi

          # --- Apply ------------------------------------------------------------
          if [[ ${#labels[@]} -eq 0 ]]; then
            echo 'No title or package.json signal; leaving the path rules to it.'
            exit 0
          fi

          printf -v joined '%s,' "${labels[@]}"
          gh pr edit "$PR_NUMBER" --add-label "${joined%,}"

          {
            echo '### Labels applied from the title and `package.json`'
            printf '%s\n' "${reasons[@]/#/- }"
          } >>"$GITHUB_STEP_SUMMARY"
