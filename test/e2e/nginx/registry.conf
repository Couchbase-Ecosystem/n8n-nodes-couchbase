# Terminates TLS for the hostname n8n's installer hard-codes and forwards to Verdaccio.
#
# This exists as a separate container so that Verdaccio can stay off the network where
# `registry.npmjs.org` is aliased — otherwise Verdaccio's own uplink would resolve that
# name to itself and every upstream fetch would loop.
server {
    listen 443 ssl;
    server_name registry.npmjs.org;

    ssl_certificate     /etc/nginx/certs/registry-cert.pem;
    ssl_certificate_key /etc/nginx/certs/registry-key.pem;

    client_max_body_size 256m;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://verdaccio:4873;
        # Verdaccio builds tarball URLs from these, so they must survive the hop.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
